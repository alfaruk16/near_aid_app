name: CI

# Build, unit-test, coverage and lint on every push to a main-line branch and
# on every pull request. Instrumented/BLE hardware tests are intentionally not
# run here — they need real phones (see docs/ci-cd.md).
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel superseded runs on the same ref so pushes don't pile up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build + unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # gradle.properties pins org.gradle.java.home to a local macOS Android
      # Studio JBR path that does not exist on the runner; drop it so Gradle
      # uses the JDK from setup-java (JAVA_HOME).
      - name: Neutralize local JDK pin for CI
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Installs the Android SDK/build-tools/platform and accepts licenses.
      # setup-java/setup-gradle do not provision the SDK, so without this the
      # Gradle build fails at configuration on a clean runner.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Configures Gradle, restores/saves the dependency + build cache, and
      # validates the Gradle wrapper checksum.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The google-services plugin requires app/google-services.json at build
      # time; it is git-ignored, so inject it from a repository secret (base64).
      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Generate JaCoCo coverage reports
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage
          path: '**/build/reports/jacoco/**'
          if-no-files-found: ignore

  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Neutralize local JDK pin for CI
        run: sed -i '/^org\.gradle\.java\.home=/d' gradle.properties

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json

      # lint.xml promotes the accessibility checks to errors, so a regression
      # there fails the build.
      - name: Run Android lint
        run: ./gradlew lint --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.*'
          if-no-files-found: ignore
