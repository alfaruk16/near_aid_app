name: CI

# Phase 1 — PR validation. Runs on PRs into main and on pushes to main.
# See docs/ci-cd.md for the full CI/CD roadmap and how to extend this.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Android + JVM + common (KMP) checks. Runs on Linux — cheap and fast.
  # `testDebugUnitTest` also executes commonTest via the Android target, so this
  # covers core/feature/app unit tests without needing a macOS runner.
  # ---------------------------------------------------------------------------
  android:
    name: Android / JVM / common
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (common + Android)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # iOS checks. Requires a macOS runner (Kotlin/Native + Xcode). Slower and
  # costs more CI minutes, so it is a separate job. Builds the shared framework,
  # runs the iOS unit tests, and compiles the Xcode app (no code signing).
  # ---------------------------------------------------------------------------
  ios:
    name: iOS (shared + Xcode)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: iOS unit tests (Kotlin/Native, simulator)
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Link shared framework (debug)
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Build iOS app (no signing)
        run: |
          xcodebuild build \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests/
          if-no-files-found: ignore
