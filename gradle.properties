# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# NOTE: `org.gradle.java.home` is intentionally NOT set here so the build stays
# CI-portable (a hardcoded local JDK path breaks CI runners). Provide a JDK 17+
# via one of:
#   - CI: actions/setup-java (see .github/workflows/ci.yml)
#   - Local terminal: export JAVA_HOME to the Android Studio JBR, or set
#     org.gradle.java.home in ~/.gradle/gradle.properties (not committed).
#   - Android Studio: Settings > Build Tools > Gradle > Gradle JDK.

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
